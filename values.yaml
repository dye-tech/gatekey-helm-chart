# GateKey Helm Chart Values

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  # External server URL - set this when deploying VPN components separately
  # If empty, uses in-cluster service: http://<release>-server:8080
  serverUrl: ""

# Common labels
commonLabels: {}
commonAnnotations: {}

# GateKey Server
server:
  enabled: true
  replicaCount: 1
  
  image:
    repository: dyetech/gatekey-server
    tag: "1.9.0"
    pullPolicy: IfNotPresent
  
  # Service account
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  
  # Pod settings
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  
  # Ingress (optional)
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gatekey.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  # Use host network (required for VPN functionality in some setups)
  hostNetwork: false
  dnsPolicy: ClusterFirst
  
  # PKI data persistence
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}
  
  # Extra environment variables
  extraEnv: []
  
  # Extra volume mounts
  extraVolumeMounts: []
  extraVolumes: []

# GateKey Web UI
web:
  enabled: true
  replicaCount: 2

  image:
    repository: dyetech/gatekey-web
    tag: "1.9.0"
    pullPolicy: IfNotPresent

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Ingress (optional)
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gatekey.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

# OpenVPN Gateway (standalone VPN gateway)
openvpnGateway:
  enabled: false
  replicaCount: 1

  image:
    repository: dyetech/gatekey-gateway
    tag: "1.9.0"
    pullPolicy: IfNotPresent

  # Gateway authentication token (from GateKey server admin panel)
  # Can be set directly or via existing secret
  token: ""
  existingSecret: ""
  existingSecretKey: "gateway-token"

  # Service configuration
  service:
    type: LoadBalancer
    port: 1194
    protocol: UDP
    annotations: {}

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Pod security - requires NET_ADMIN for VPN
  podSecurityContext:
    runAsNonRoot: false

  securityContext:
    capabilities:
      add:
        - NET_ADMIN

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra environment variables
  extraEnv: []

