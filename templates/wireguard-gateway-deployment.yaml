{{- if .Values.wireguardGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatekey.fullname" . }}-wireguard-gateway
  labels:
    {{- include "gatekey.wireguardGateway.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.wireguardGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "gatekey.wireguardGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gatekey.wireguardGateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wireguardGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wireguard-gateway
          image: {{ include "gatekey.wireguardGateway.image" . }}
          imagePullPolicy: {{ .Values.wireguardGateway.image.pullPolicy }}
          {{- with .Values.wireguardGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: {{ .Values.wireguardGateway.service.protocol | default "UDP" }}
          env:
            - name: GATEKEY_SERVER_URL
              value: {{ include "gatekey.serverUrl" . | quote }}
            {{- if or .Values.wireguardGateway.token .Values.wireguardGateway.existingSecret }}
            - name: GATEKEY_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.wireguardGateway.existingSecret }}
                  name: {{ .Values.wireguardGateway.existingSecret }}
                  key: {{ .Values.wireguardGateway.existingSecretKey }}
                  {{- else }}
                  name: {{ include "gatekey.fullname" . }}-vpn-tokens
                  key: wireguard-gateway-token
                  {{- end }}
            {{- end }}
            {{- with .Values.wireguardGateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.wireguardGateway.resources | nindent 12 }}
      {{- with .Values.wireguardGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wireguardGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wireguardGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
